<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1.00001,viewport-fit=cover" />
    <meta name="theme-color" content="#0A1628" />
    <title>SMS ONCF · DRIC</title>
    <style>
      /* Fix scrolling React Native Web : les ScrollView ont besoin que le root ait une hauteur définie */
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0A1628;
      }

      /* Supprime la scrollbar native du navigateur sur les éléments RN Web */
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
